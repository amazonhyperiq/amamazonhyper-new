<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الإدارة — أمازون هايبر ماركت</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#064b24,#0b8a43);
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.card{
  width:min(430px,100%);
  background:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 50px #0004;
  text-align:center
}

.logo{font-size:55px}

h1{
  color:#075b2b;
  margin:10px 0 5px
}

p{color:#68736c}

label{
  display:block;
  text-align:right;
  font-weight:700;
  margin:16px 0 7px
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d4ded7;
  border-radius:12px;
  font:inherit
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#07853b;
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer
}

button:disabled{opacity:.6}

.error{
  color:#c62828;
  min-height:22px;
  margin-top:12px;
  font-size:14px
}

.success{
  color:#087438;
  min-height:22px;
  margin-top:12px;
  font-size:14px
}

.link{
  display:block;
  margin-top:15px;
  color:#087438;
  text-decoration:none;
  cursor:pointer
}

.back{
  display:block;
  margin-top:15px;
  color:#087438;
  text-decoration:none
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card">

<div class="logo">🔐</div>

<h1 id="pageTitle">دخول الإدارة</h1>

<p id="pageSubtitle">أمازون هايبر ماركت</p>


<!-- تسجيل الدخول -->

<div id="loginSection">

<form id="loginForm">

<label>البريد الإلكتروني</label>

<input
id="email"
type="email"
autocomplete="username"
value="omar7826311@gmail.com"
required>


<label>كلمة المرور</label>

<input
id="password"
type="password"
autocomplete="current-password"
required>


<button id="loginButton" type="submit">
دخول لوحة التحكم
</button>

<div class="error" id="error"></div>

</form>


<a
class="link"
id="forgotPassword"
href="#">
نسيت كلمة المرور؟
</a>

<a class="back" href="index.html">
العودة إلى المتجر
</a>

</div>



<!-- استعادة كلمة المرور -->

<div id="resetSection" class="hidden">

<p>
أدخل كلمة المرور الجديدة
</p>

<form id="resetForm">

<label>كلمة المرور الجديدة</label>

<input
id="newPassword"
type="password"
autocomplete="new-password"
minlength="6"
required>


<label>تأكيد كلمة المرور</label>

<input
id="confirmPassword"
type="password"
autocomplete="new-password"
minlength="6"
required>


<button id="resetButton" type="submit">
حفظ كلمة المرور
</button>

<div class="error" id="resetError"></div>

<div class="success" id="resetSuccess"></div>

</form>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://vvexorzjkpwduykinwsw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RoMHq19grLJWNu95uPSwug_XwiKt2bB";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



/* تسجيل الدخول */

document.getElementById("loginForm").addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const errorBox =
document.getElementById("error");

const button =
document.getElementById("loginButton");

errorBox.textContent="";

button.disabled=true;

button.textContent="جاري الدخول...";

try{

const {data,error} =
await db.auth.signInWithPassword({
  email:email,
  password:password
});

if(error) throw error;

const user=data.user;


/* التحقق من صلاحية الأدمن */

const {data:roleData,error:roleError} =
await db
.from("user_roles")
.select("role")
.eq("user_id",user.id)
.maybeSingle();

if(roleError) throw roleError;

if(!roleData || roleData.role!=="admin"){

await db.auth.signOut();

throw new Error(
"هذا الحساب ليس لديه صلاحية دخول الإدارة."
);

}


/* دخول لوحة التحكم */

location.replace("admin.html");

}

catch(error){

console.error(error);

errorBox.textContent =
error.message ||
"فشل تسجيل الدخول.";

}

finally{

button.disabled=false;

button.textContent="دخول لوحة التحكم";

}

});



/* إرسال طلب استعادة كلمة المرور */

document.getElementById("forgotPassword").addEventListener(
"click",
async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const errorBox =
document.getElementById("error");

if(!email){

errorBox.textContent=
"اكتب البريد الإلكتروني أولاً.";

return;

}

errorBox.textContent="جاري إرسال رسالة الاستعادة...";

try{

const {error} =
await db.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://amazonhyperig.github.io/amazonhyper-new/login.html"
}
);

if(error) throw error;

errorBox.className="success";

errorBox.textContent=
"تم إرسال رسالة استعادة كلمة المرور إلى بريدك الإلكتروني.";

}

catch(error){

console.error(error);

errorBox.className="error";

errorBox.textContent=
error.message ||
"تعذر إرسال رسالة الاستعادة.";

}

});



/* مراقبة رابط استعادة كلمة المرور */

db.auth.onAuthStateChange(
async function(event,session){

if(event==="PASSWORD_RECOVERY"){

document.getElementById("loginSection")
.classList.add("hidden");

document.getElementById("resetSection")
.classList.remove("hidden");

document.getElementById("pageTitle")
.textContent="تغيير كلمة المرور";

document.getElementById("pageSubtitle")
.textContent="أمازون هايبر ماركت";

}

});



/* حفظ كلمة المرور الجديدة */

document.getElementById("resetForm").addEventListener(
"submit",
async function(e){

e.preventDefault();

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

const errorBox =
document.getElementById("resetError");

const successBox =
document.getElementById("resetSuccess");

const button =
document.getElementById("resetButton");

errorBox.textContent="";

successBox.textContent="";


if(newPassword!==confirmPassword){

errorBox.textContent=
"كلمتا المرور غير متطابقتين.";

return;

}


if(newPassword.length<6){

errorBox.textContent=
"كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";

return;

}


button.disabled=true;

button.textContent="جاري الحفظ...";


try{

const {error} =
await db.auth.updateUser({
password:newPassword
});

if(error) throw error;

successBox.textContent=
"تم تغيير كلمة المرور بنجاح.";

button.textContent="تم الحفظ";


setTimeout(async()=>{

await db.auth.signOut();

location.replace("login.html");

},1500);

}

catch(error){

console.error(error);

errorBox.textContent=
error.message ||
"تعذر تغيير كلمة المرور.";

button.disabled=false;

button.textContent="حفظ كلمة المرور";

}

});

</script>

</body>
</html>
