<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الإدارة — أمازون هايبر ماركت</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:linear-gradient(135deg,#064b24,#0b8a43);
min-height:100vh;
display:grid;
place-items:center;
padding:20px
}
.card{
width:min(430px,100%);
background:#fff;
border-radius:24px;
padding:30px;
box-shadow:0 20px 50px #0004;
text-align:center
}
.logo{font-size:55px}
h1{color:#075b2b;margin:10px 0 5px}
p{color:#68736c}
label{
display:block;
text-align:right;
font-weight:700;
margin:16px 0 7px
}
input{
width:100%;
padding:14px;
border:1px solid #d4ded7;
border-radius:12px;
font:inherit
}
button{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:12px;
background:#07853b;
color:#fff;
font-size:16px;
font-weight:900;
cursor:pointer
}
button:disabled{opacity:.6}
.error{
color:#c62828;
min-height:22px;
margin-top:12px;
font-size:14px
}
.back{
display:block;
margin-top:15px;
color:#087438;
text-decoration:none
}
</style>
</head>

<body>

<div class="card">
<div class="logo">🔐</div>
<h1>دخول الإدارة</h1>
<p>أمازون هايبر ماركت</p>

<form id="loginForm">

<label>البريد الإلكتروني</label>
<input
id="email"
type="email"
autocomplete="username"
value="omar7826311@gmail.com"
required>

<label>كلمة المرور</label>
<input
id="password"
type="password"
autocomplete="current-password"
required>

<button id="loginButton" type="submit">
دخول لوحة التحكم
</button>

<div class="error" id="error"></div>

</form>

<a class="back" href="index.html">العودة إلى المتجر</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://vvexorzjkpwduykinwsw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_RoMHq19grLJWNu95uPSwug_XwiKt2bB";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document.getElementById("loginForm").addEventListener(
"submit",
async function(e){

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const errorBox =
document.getElementById("error");

const button =
document.getElementById("loginButton");

errorBox.textContent = "";

button.disabled = true;
button.textContent = "جاري الدخول...";

try{

const {data,error} =
await db.auth.signInWithPassword({
email,
password
});

if(error) throw error;

const user = data.user;

const {data:roleData,error:roleError} =
await db
.from("user_roles")
.select("role")
.eq("user_id",user.id)
.single();

if(roleError) throw roleError;

if(roleData.role !== "admin"){

await db.auth.signOut();

throw new Error(
"هذا الحساب ليس لديه صلاحية دخول الإدارة."
);

}

location.replace("admin.html");

}catch(error){

console.error(error);

errorBox.textContent =
error.message ||
"فشل تسجيل الدخول.";

}finally{

button.disabled = false;
button.textContent = "دخول لوحة التحكم";

}

});
</script>

</body>
</html>
