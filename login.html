<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول الإدارة — أمازون هايبر ماركت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#064b24,#0b8a43);min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 20px 50px #0004;text-align:center}.logo{font-size:55px}h1{color:#075b2b;margin:10px 0 5px}p{color:#68736c}label{display:block;text-align:right;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px;border:1px solid #d4ded7;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#07853b;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.error{color:#c62828;min-height:22px;margin-top:12px;font-size:14px}.back{display:block;margin-top:15px;color:#087438;text-decoration:none}
</style></head>
<body><div class="card"><div class="logo">🔐</div><h1>دخول الإدارة</h1><p>أمازون هايبر ماركت</p>
<form id="loginForm"><label>اسم المستخدم</label><input id="username" autocomplete="username" required>
<label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">دخول لوحة التحكم</button><div class="error" id="error"></div></form>
<a class="back" href="index.html">العودة إلى المتجر</a></div>
<script>
const USERNAME="amazon", PASSWORD_HASH="c7e9988d0ac79f466bf33b7bc5a8e31ebad2fe1f6e17c78919f5717acce44230";
async function sha256(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const u=document.getElementById("username").value.trim(),p=document.getElementById("password").value;const ok=u===USERNAME&&(await sha256(p))===PASSWORD_HASH;if(ok){sessionStorage.setItem("adminLoggedIn","1");location.href="admin.html";}else document.getElementById("error").textContent="اسم المستخدم أو كلمة المرور غير صحيحة.";})
</script></body></html>
