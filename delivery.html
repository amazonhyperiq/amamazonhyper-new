<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة موظف التوصيل — أمازون هايبر ماركت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#eef3ef;font-family:Arial,sans-serif;color:#183322}
.wrap{max-width:900px;margin:auto;padding:18px}
header{background:#064b24;color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
h1{margin:0 0 6px;font-size:24px}.hint{opacity:.9}
.card{background:#fff;border:1px solid #dce6df;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.info{line-height:1.9}.money{font-size:20px;font-weight:900;color:#087438}
button{border:0;border-radius:11px;padding:13px 18px;font-weight:900;cursor:pointer}
.complete{background:#07853b;color:#fff;width:100%;margin-top:12px}
.refresh{background:#fff;color:#075d2d;border:1px solid #b9cdbf}
.empty{text-align:center;padding:35px;color:#68756d}
.status{display:inline-block;background:#f3e8ff;color:#6d28a8;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900}
.error{background:#fff0f0;color:#b42318;padding:14px;border-radius:12px}
@media(min-width:650px){.complete{width:auto;min-width:180px}}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox" class="card" style="max-width:460px;margin:40px auto">
    <div style="font-size:50px;text-align:center">🚚</div>
    <h1 style="text-align:center;color:#075b2b">دخول موظف التوصيل</h1>
    <p style="text-align:center;color:#68736d">أمازون هايبر ماركت</p>

    <label style="display:block;font-weight:900;margin:16px 0 7px">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username"
           placeholder="البريد الإلكتروني"
           style="width:100%;padding:14px;border:1px solid #d4ded7;border-radius:12px;font:inherit">

    <label style="display:block;font-weight:900;margin:16px 0 7px">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password"
           placeholder="كلمة المرور"
           style="width:100%;padding:14px;border:1px solid #d4ded7;border-radius:12px;font:inherit">

    <button id="loginBtn" class="complete">دخول</button>
    <div id="loginError" class="error" style="margin-top:12px"></div>
    <a href="index.html" style="display:block;text-align:center;margin-top:15px;color:#087438;text-decoration:none">
      العودة إلى المتجر
    </a>
  </div>

  <div id="dashboard" style="display:none">
    <header>
      <div class="row">
        <div>
          <h1>🚚 موظف التوصيل</h1>
          <div class="hint">الطلبات الجاهزة للتوصيل</div>
        </div>
        <button class="refresh" id="logout">تسجيل الخروج</button>
      </div>
    </header>

    <div class="row" style="margin-bottom:14px">
      <strong id="count">0 طلب</strong>
      <button class="refresh" id="refresh">🔄 تحديث</button>
    </div>

    <div id="message"></div>
    <div id="orders"></div>
  </div>

</div>

<script>
const SUPABASE_URL="https://vvexorzjkpwduykinwsw.supabase.co";
const SUPABASE_KEY="sb_publishable_RoMHq19grLJWNu95uPSwug_XwiKt2bB";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const DELIVERY_EMAIL="altaiemar52@gmail.com";

function money(v){
  return new Intl.NumberFormat("ar-IQ").format(Number(v)||0)+" د.ع";
}
function esc(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function date(v){
  if(!v)return "—";
  const d=new Date(v);
  return Number.isNaN(d.getTime())?String(v):d.toLocaleString("ar-IQ");
}

async function loadOrders(){
  const box=document.getElementById("orders");
  const msg=document.getElementById("message");
  box.innerHTML='<div class="card empty">جاري تحميل الطلبات...</div>';
  msg.innerHTML="";

  const {data,error}=await db.from("orders").select("*")
    .in("status",["received","preparing"]).order("created_at",{ascending:false});

  if(error){
    msg.innerHTML='<div class="error">تعذر تحميل الطلبات: '+esc(error.message)+'</div>';
    box.innerHTML="";
    document.getElementById("count").textContent="0 طلب";
    return;
  }

  const orders=Array.isArray(data)?data:[];
  document.getElementById("count").textContent=orders.length+" طلب";

  if(!orders.length){
    box.innerHTML='<div class="card empty">لا توجد طلبات جاهزة للتوصيل حالياً.</div>';
    return;
  }

  box.innerHTML=orders.map(o=>`
    <div class="card" id="order-${esc(o.id)}">
      <div class="row">
        <div class="info">
          <div><strong>الزبون:</strong> ${esc(o.customer_name||"بدون اسم")}</div>
          <div><strong>الهاتف:</strong> ${esc(o.customer_phone||"—")}</div>
          <div><strong>المنطقة:</strong> ${esc(o.delivery_group||"—")} — ${esc(o.delivery_area||"—")}</div>
          <div><strong>العنوان:</strong> ${esc(o.address||"—")}</div>
          <div><strong>التاريخ:</strong> ${esc(date(o.created_at))}</div>
        </div>
        <div>
          <span class="status">${esc(o.status==="preparing"?"قيد التجهيز":"تم الاستلام")}</span>
          <div class="money" style="margin-top:10px">${money(o.total)}</div>
        </div>
      </div>
      <button class="complete" data-id="${esc(o.id)}">✅ إتمام الطلب</button>
    </div>
  `).join("");

  box.querySelectorAll(".complete").forEach(btn=>{
    btn.addEventListener("click",()=>completeOrder(btn.dataset.id));
  });
}

async function completeOrder(id){
  if(!confirm("تأكيد إتمام الطلب وتسليمه للزبون؟")) return;

  const btn=document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if(btn){btn.disabled=true;btn.textContent="جاري الإتمام...";}

  const {error}=await db.from("orders").update({status:"delivered"}).eq("id",id);

  if(error){
    alert("فشل إتمام الطلب:\n"+error.message);
    if(btn){btn.disabled=false;btn.textContent="✅ إتمام الطلب";}
    return;
  }

  await loadOrders();
}

async function showDashboard(session){
  const email=(session?.user?.email||"").toLowerCase();
  if(email!==DELIVERY_EMAIL){
    await db.auth.signOut();
    document.getElementById("loginError").textContent="هذا الحساب ليس حساب موظف التوصيل.";
    return;
  }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  await loadOrders();
}

document.getElementById("loginBtn").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim().toLowerCase();
  const password=document.getElementById("password").value;
  const err=document.getElementById("loginError");
  err.textContent="";

  if(email!==DELIVERY_EMAIL){
    err.textContent="استخدم بريد موظف التوصيل فقط.";
    return;
  }
  if(!password){
    err.textContent="أدخل كلمة المرور.";
    return;
  }

  const btn=document.getElementById("loginBtn");
  btn.disabled=true;
  btn.textContent="جاري الدخول...";

  const {data,error}=await db.auth.signInWithPassword({email,password});

  btn.disabled=false;
  btn.textContent="دخول";

  if(error){
    err.textContent=error.message==="Invalid login credentials"
      ?"البريد الإلكتروني أو كلمة المرور غير صحيحة."
      :error.message;
    return;
  }

  await showDashboard(data.session);
});

document.getElementById("refresh").addEventListener("click",loadOrders);

document.getElementById("logout").addEventListener("click",async()=>{
  await db.auth.signOut();
  document.getElementById("dashboard").style.display="none";
  document.getElementById("loginBox").style.display="block";
  document.getElementById("password").value="";
});

(async()=>{
  const {data}=await db.auth.getSession();
  if(data.session) await showDashboard(data.session);
})();
</script>
</body>
</html>
